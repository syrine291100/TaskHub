services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub_dev
      POSTGRES_DB: taskhub
    ports:
      - "5434:5432"
    volumes:
      - taskhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://taskhub:taskhub_dev@db:5432/taskhub
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and configure JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/database')"]
      interval: 10s
      timeout: 5s
      retries: 15
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  taskhub_postgres_data:
